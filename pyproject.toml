[project]
name = "kb-agent"
version = "0.1.0"
description = "Enterprise Knowledge Base Agent Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.140.13",
    "google-adk>=0.0.1",
    "google-cloud-aiplatform>=1.163.0",
    "google-cloud-bigquery>=3.42.2",
    "google-cloud-discoveryengine>=0.20.2",
    "google-cloud-logging>=3.16.1",
    "google-cloud-secret-manager>=2.30.0",
    "google-cloud-storage>=3.13.0",
    "google-genai>=2.14.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-gcp-trace>=1.12.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 80
indent-width = 2
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "TRY401"]

line-length = 80
indent-width = 2
target-version = "py311"

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
