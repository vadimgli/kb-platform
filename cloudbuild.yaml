steps:
  # 1. Run unit test suite, coverage verification, and golden benchmarks
  - name: 'python:3.11-slim'
    id: 'test-and-eval'
    dir: 'backend'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        pip install --no-cache-dir uv
        export UV_DEFAULT_INDEX=https://pypi.org/simple
        uv sync
        uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=80
        uv run python evals/run_benchmark.py

  # 2. Build production container image using backend/Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    dir: 'backend'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/artifactforge-api:${_SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/artifactforge-api:latest'
      - '.'

  # 3. Push container images to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image-sha'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/artifactforge-api:${_SHORT_SHA}'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image-latest'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/artifactforge-api:latest'

  # 4. Deploy Serverless Container to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'artifactforge-api'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/artifactforge-api:${_SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--service-account=${_SERVICE_ACCOUNT}@${PROJECT_ID}.iam.gserviceaccount.com'
      - '--port=8000'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--set-env-vars=GCP_PROJECT_ID=${PROJECT_ID},GCP_LOCATION=${_REGION},DATA_STORE_ID=${_DATA_STORE_ID},DEFAULT_MODEL_NAME=gemini-2.5-flash,LIGHTWEIGHT_MODEL_NAME=gemini-2.5-flash-lite,PLANNER_MODEL_NAME=gemini-2.5-flash,EXECUTOR_MODEL_NAME=gemini-2.5-flash-lite,CORS_ALLOWED_ORIGINS=*'
      - '--allow-unauthenticated'

substitutions:
  _REGION: us-central1
  _REPO_NAME: artifactforge-repo
  _SERVICE_ACCOUNT: artifactforge-sa
  _DATA_STORE_ID: kb-datastore-dev
  _SHORT_SHA: latest

options:
  logging: CLOUD_LOGGING_ONLY
